<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Ascii Renderer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="scripts/main.js" type="module" defer></script>
  </head>

  <body>
    <section class="program">
      <section class="document-view">
        <section class="toolbar">
          <div id="output-radios">
            <input
              type="radio"
              id="output-ascii"
              name="output"
              value="ascii"
              checked
            />
            <label for="output-ascii">ASCII</label>
            <input type="radio" id="output-image" name="output" value="image" />
            <label for="output-image">IMAGE</label>
            <input
              type="radio"
              id="output-preprocessed"
              name="output"
              value="preprocessed"
            />
            <label for="output-preprocessed">PREPROCESSED</label>
          </div>
          <div class="zoom">
            <p id="document-width"></p>
            <button id="zoom-in">+</button>
            <button id="zoom-out">-</button>
          </div>
        </section>
        <div class="document-container">
          <div id="document">
            <div id="ascii-output"><svg></svg></div>
            <img id="input-image" />
            <canvas id="preprocess-canvas"></canvas>
          </div>
        </div>
      </section>
      <section class="sidebar">
        <fieldset>
          <legend>Image</legend>
          <label>File</label>
          <input type="file" id="image" /><br />
          <label>Brightness curve</label><br />
          <svg
            id="brightness-curve"
            width="200"
            height="200"
            xmlns="http://www.w3.org/2000/svg"
            style="background: grey"
          ></svg
          ><br />
          <label>Contrast</label>
          <input type="number" id="contrast" value="0.6" /><br />
          <label>Brightness</label>
          <input type="number" id="brightness" value="-0.3" /><br />
          <label>Saturation</label>
          <input type="number" id="saturation" value="1" /><br />
        </fieldset>
        <fieldset>
          <legend>Text</legend>
          <label>Font name (local)</label>
          <input type="text" id="font-name" /><br />
          <label>Font weight</label>
          <input type="text" id="font-weight" /><br />
          <label>Line height</label>
          <input type="number" id="line-height" value="1" /><br />
          <label>Characters</label>
          <textarea id="chars">
 !"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~</textarea
          ><br />
          <label>Background color</label>
          <input type="color" id="background-color" value="#000000" /><br />
          <label>Add Custom Color</label>
          <input type="color" id="custom-color" value="#FFFFFF" />
          <button id="add-custom-color-button">Add Color</button>
          <ul id="color-list"></ul>
        </fieldset>
        <fieldset>
          <legend>Output</legend>
          <label>Width in symbols</label>
          <input type="number" id="symbol-width" value="64" /><br />

          <label>Scale Weight 1</label>
          <input type="number" id="scale-weight-1" value="1.0" /><br />
          <label>Scale Weight 2</label>
          <input type="number" id="scale-weight-2" value="1.0" /><br />
          <label>Scale Weight 4</label>
          <input type="number" id="scale-weight-4" value="1.0" /><br />
          <label>Scale Weight 8</label>
          <input type="number" id="scale-weight-8" value="1.0" /><br />
          <br />
          <label>Squared weight</label>
          <input type="number" id="squared-weight" value="0.1" /><br />
        </fieldset>
        <br />
        <fieldset>
          <legend>Download</legend>
          <label>PNG width (px)</label>
          <input type="number" id="png-width" value="1920" />
          <button id="download-png-button">Download PNG</button><br /><br />
          <button id="download-svg-button">Download SVG</button>
        </fieldset>
        <br />
        <button id="draw-button">Draw</button>
        <button id="preset1-button">Preset1</button>
        <button id="preset2-button">Preset2</button>
        <button id="preset3-button">Preset3</button>
      </section>
    </section>
  </body>
</html>
